<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130" role="img" aria-label="Citação do Carlos Alves" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0.5" y="0.5" width="519" height="129" rx="8" fill="#151a2b" stroke="#252c47"/>
  <text x="260" y="55" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-style="italic" fill="#5ec4b6">“Sempre à procura de aprender coisas novas</text>
  <text x="260" y="80" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" font-style="italic" fill="#5ec4b6">e enfrentar novos desafios!”</text>
  <text x="496" y="112" text-anchor="end" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" font-style="italic" fill="#8aa0c8">- Carlos Alves</text>
